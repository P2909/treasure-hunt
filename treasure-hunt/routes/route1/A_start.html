<!DOCTYPE html>
<html>
<head>
  <title>Checkpoint</title>

  <!-- Mobile friendly -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Common styling -->
  <link rel="stylesheet" href="../../assets/style.css">
</head>

<body>

<div class="container">

  <h2>Checkpoint Access</h2>

  <p>Enter your team number to continue.</p>

  <form
    action="https://docs.google.com/forms/d/e/1FAIpQLScZ1U9RnxA8T1iDyusjruMXbanuxM5ms8_vumkX44O5db-zJg/formResponse"
    method="POST"
    target="hidden_iframe"
    onsubmit="setTimeout(function(){ window.location.href='A_clue.html'; }, 300);"
  >

    <!-- Team number -->
    <input
      type="text"
      name="entry.1251204413"
      placeholder="Team Number"
      required
    >

    <!-- Route number (CHANGE PER ROUTE) -->
    <input
      type="hidden"
      name="entry.1865076517"
      value="1"
    >

    <!-- Checkpoint letter (CHANGE PER FILE) -->
    <input
      type="hidden"
      name="entry.1000834704"
      value="A"
    >

    <button type="submit">Continue</button>
  </form>

  <!-- Hidden iframe so Google Form submits silently -->
  <iframe name="hidden_iframe" style="display:none;"></iframe>

</div>

</body>
</html>
