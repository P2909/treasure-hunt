<!DOCTYPE html>
<html>
<head>
  <title>Final Checkpoint</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../../assets/style.css">
</head>

<body>

<div class="container">

  <h2>Final Audit Lock</h2>

  <!-- PUZZLE -->
  <p>
    An outlet reported the following:
  </p>

  <p style="text-align:left;">
    • Revenue = ₹8,000 <br>
    • Operating cost = 45% of revenue <br>
    • Tax = 13% of profit
  </p>

  <p>
    Find the <b>tax amount</b>.<br>
    That number is your code.
  </p>

  <input id="codeInput" placeholder="Enter 3-digit code">

  <button onclick="checkCode()">Unlock</button>

  <p id="error" style="display:none; color:#f87171;">
    Incorrect code. Recheck your calculations.
  </p>

  <!-- SUCCESS -->
  <div id="success" style="display:none; margin-top:20px;">
    <p><b>ACCESS GRANTED</b></p>

    <h1>572</h1>

    <p style="margin-top:15px;">
      Audit complete. <br>
      Final file located. <br>
      Proceed immediately.
    </p>
  </div>

</div>

<script>
function checkCode() {
  const val = document.getElementById("codeInput").value.trim();
  if (val === "572") {
    document.getElementById("success").style.display = "block";
    document.getElementById("error").style.display = "none";
  } else {
    document.getElementById("error").style.display = "block";
  }
}
</script>

</body>
</html>
