<!DOCTYPE html>
<html>
<head>
  <title>Clue</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../../assets/style.css">
</head>

<body>

<div class="container">

  <h2>Audit Log</h2>

  <!-- MAIN CLUE -->
  <p>
  Yahan shabd kam, rang zyada bolte hain, Ideas chupe hote hue bhi dikh jaate hain.
  </p>

  <!-- TIMER -->
  <p id="timer" style="margin-top:15px; color:#94a3b8;">
    Hint available in 07:00
  </p>

  <!-- HINT BUTTON -->
  <button id="hintBtn" onclick="showHint()" style="display:none;">
    Show Hint
  </button>

  <!-- HINT TEXT -->
  <div id="hintBox" style="display:none; margin-top:18px; color:#facc15;">
    <b>Hint:</b> art and decor
  </div>

</div>

<script>
let timeLeft = 7 * 60; // 7 minutes in seconds
const timerEl = document.getElementById("timer");
const hintBtn = document.getElementById("hintBtn");

const countdown = setInterval(() => {
  let minutes = Math.floor(timeLeft / 60);
  let seconds = timeLeft % 60;

  timerEl.innerText =
    "Hint available in " +
    String(minutes).padStart(2, '0') + ":" +
    String(seconds).padStart(2, '0');

  timeLeft--;

  if (timeLeft < 0) {
    clearInterval(countdown);
    timerEl.innerText = "Hint unlocked";
    hintBtn.style.display = "block";
  }
}, 1000);

function showHint() {
  document.getElementById("hintBox").style.display = "block";
}
</script>

</body>
</html>
